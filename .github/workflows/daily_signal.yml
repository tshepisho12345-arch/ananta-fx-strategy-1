name: ANANTA Daily Signal Pipeline

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch: 

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      defaults:
        run:
          working-directory: ./ananta-fx-strategy-1

    - name: Execute ANANTA Engine
      run: |
        python src/main.py
      defaults:
        run:
          working-directory: ./ananta-fx-strategy-1
